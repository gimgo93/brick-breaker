<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#192538;--ink:#eef4ff;--muted:#a8b6ce;--accent:#72e6c1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#263952,#101522 70%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px}.wrap{width:min(760px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}h1{margin:0;font-size:2rem}.sub{color:var(--muted);margin:4px 0 0}.stats{display:flex;gap:9px}.stat{background:var(--panel);border:1px solid #34445d;border-radius:12px;padding:8px 13px;min-width:78px;text-align:center}.stat b{display:block;font-size:1.15rem}.stat small{color:var(--muted)}.frame{position:relative;padding:10px;background:#0a1020;border:1px solid #34445d;border-radius:18px;box-shadow:0 24px 70px #0008}canvas{width:100%;height:auto;display:block;border-radius:10px;touch-action:none}.overlay{position:absolute;inset:10px;border-radius:10px;background:#0a1020d9;display:grid;place-items:center;text-align:center;padding:18px}.overlay.hide{display:none}.card h2{font-size:1.8rem;margin:0}.card p{color:#c4d0e3;margin:8px 0 18px}.button{border:0;border-radius:999px;padding:12px 24px;background:var(--accent);color:#10221f;font-weight:700;font-size:1rem;cursor:pointer}.button:hover{filter:brightness(1.08)}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;padding-top:10px}@media(max-width:520px){header,footer{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}}
</style></head><body><main class="wrap">
<header><div><h1>벽돌깨기</h1><p class="sub">내려오는 벽돌을 깨고 공을 모아보세요.</p></div><div class="stats"><div class="stat"><b id="score">0</b><small>점수</small></div><div class="stat"><b id="balls">1</b><small>공</small></div><div class="stat"><b id="speed">느림</b><small>속도</small></div></div></header>
<div class="frame"><canvas id="game" width="720" height="500" aria-label="벽돌깨기 게임"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">준비됐나요?</h2><p id="message">패들을 움직여 공을 튕기세요. 50점마다 공이 하나 추가돼요.</p><button class="button" id="start">게임 시작</button></div></div></div>
<footer><span>마우스·터치 또는 ← → 방향키로 패들 이동</span><span>스페이스바: 일시정지 · R: 다시 시작</span></footer>
</main><script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),titleEl=document.querySelector('#title'),messageEl=document.querySelector('#message'),startButton=document.querySelector('#start'),scoreEl=document.querySelector('#score'),ballsEl=document.querySelector('#balls'),speedEl=document.querySelector('#speed');
const W=canvas.width,H=canvas.height,COLS=7,LEFT=24,CELL_W=88,CELL_GAP=8,BRICK_H=22,colors=['#72e6c1','#63c7ff','#a996ff','#ff8b9a','#ffd166'];
const paddle={x:(W-112)/2,y:H-42,w:112,h:13,speed:8};let balls=[],bricks=[],score=0,active=false,paused=false,lastFrame=0,lastRow=0,rowCounter=0,keys={};
function tier(){if(score<100)return{name:'느림',ball:3.2,brick:13,row:3900};if(score<=500)return{name:'빠름',ball:4.5,brick:22,row:3100};return{name:'최고',ball:5.8,brick:32,row:2400}}
function makeBall(x=paddle.x+paddle.w/2,y=paddle.y-12,angle=-Math.PI/2){const s=tier().ball;return{x,y,r:8,dx:Math.cos(angle)*s,dy:Math.sin(angle)*s}}
function startGame(){score=0;balls=[makeBall()];bricks=[];rowCounter=0;paddle.x=(W-paddle.w)/2;lastFrame=0;lastRow=performance.now();active=true;paused=false;overlay.classList.add('hide');updateHud();draw();requestAnimationFrame(tick)}
function updateHud(){scoreEl.textContent=score;ballsEl.textContent=balls.length;speedEl.textContent=tier().name}
function addRow(){const gapCount=Math.random()<.35?2:1,gaps=new Set();while(gaps.size<gapCount)gaps.add(Math.floor(Math.random()*COLS));const color=colors[rowCounter++%colors.length];for(let col=0;col<COLS;col++)if(!gaps.has(col))bricks.push({x:LEFT+col*(CELL_W+CELL_GAP),y:-BRICK_H-4,w:CELL_W,h:BRICK_H,color,alive:true})}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#142039');bg.addColorStop(1,'#0d1422');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff0b';for(let i=0;i<35;i++){ctx.beginPath();ctx.arc((i*97)%W,(i*53)%H,1.3,0,Math.PI*2);ctx.fill()}for(const z of bricks)if(z.alive)rounded(z.x,z.y,z.w,z.h,5,z.color);rounded(paddle.x,paddle.y,paddle.w,paddle.h,7,'#edf4ff');rounded(paddle.x+10,paddle.y+2,paddle.w-20,3,2,'#fff');for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#72e6c1';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0}}
function finish(){active=false;titleEl.textContent='게임 오버';messageEl.textContent='공을 모두 잃었어요. 최종 점수 '+score+'점!';startButton.textContent='다시 하기';overlay.classList.remove('hide')}
function awardPoints(){score+=10;const bonus=Math.floor(score/50)-Math.floor((score-10)/50);for(let i=0;i<bonus;i++){const angle=-Math.PI/2+(Math.random()-.5)*.9;balls.push(makeBall(paddle.x+paddle.w/2,paddle.y-14,angle))}updateHud()}
function tick(now){if(!active||paused)return;if(!lastFrame)lastFrame=now;const dt=Math.min((now-lastFrame)/1000,.04);lastFrame=now;const speed=tier();if(keys.ArrowLeft)paddle.x-=paddle.speed;if(keys.ArrowRight)paddle.x+=paddle.speed;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));if(now-lastRow>=speed.row){addRow();lastRow=now}for(const z of bricks)if(z.alive)z.y+=speed.brick*dt;
for(const b of balls){b.x+=b.dx*dt*60;b.y+=b.dy*dt*60;if(b.x<b.r){b.x=b.r;b.dx=Math.abs(b.dx)}if(b.x>W-b.r){b.x=W-b.r;b.dx=-Math.abs(b.dx)}if(b.y<b.r){b.y=b.r;b.dy=Math.abs(b.dy)}if(b.dy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&b.x>=paddle.x&&b.x<=paddle.x+paddle.w){const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2),s=tier().ball;b.dx=hit*s*.95;b.dy=-Math.sqrt(Math.max(1,s*s-b.dx*b.dx))}for(const z of bricks){if(!z.alive)continue;if(b.x+b.r>z.x&&b.x-b.r<z.x+z.w&&b.y+b.r>z.y&&b.y-b.r<z.y+z.h){z.alive=false;b.dy=-Math.abs(b.dy);awardPoints();break}}}
balls=balls.filter(b=>b.y<H+b.r);updateHud();bricks=bricks.filter(z=>z.alive&&z.y<H);if(!balls.length){finish();return}draw();requestAnimationFrame(tick)}
function movePaddle(clientX){const r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(clientX-r.left)*W/r.width-paddle.w/2));draw()}canvas.addEventListener('pointermove',e=>movePaddle(e.clientX));canvas.addEventListener('pointerdown',e=>movePaddle(e.clientX));startButton.addEventListener('click',startGame);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='r'||e.key==='R')startGame();if(e.key===' '&&active){paused=!paused;if(!paused){lastFrame=0;requestAnimationFrame(tick)}}});window.addEventListener('keyup',e=>keys[e.key]=false);updateHud();draw();
})();
</script></body></html>
