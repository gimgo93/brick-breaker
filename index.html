<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽돌깨기</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#263952,#101522 70%);color:#eef4ff;font:16px system-ui,sans-serif;padding:20px}.wrap{width:min(760px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}h1{margin:0;font-size:2rem}p{color:#b7c4d9;margin:.25rem 0}.stats{display:flex;gap:10px}.stat{background:#192538;border:1px solid #34445d;border-radius:12px;padding:8px 14px;text-align:center}.stat b{display:block;font-size:1.2rem}.stat small{color:#a8b6ce}.frame{position:relative;padding:10px;background:#0a1020;border:1px solid #34445d;border-radius:18px;box-shadow:0 24px 70px #0008}canvas{width:100%;height:auto;display:block;border-radius:10px;touch-action:none}.overlay{position:absolute;inset:10px;border-radius:10px;background:#0a1020cc;display:grid;place-items:center;text-align:center;padding:18px}.overlay.hide{display:none}.card h2{font-size:1.8rem;margin:0}.card p{margin:8px 0 18px}.button{border:0;border-radius:999px;padding:12px 24px;background:#72e6c1;color:#10221f;font-weight:700;font-size:1rem;cursor:pointer}footer{display:flex;justify-content:space-between;gap:12px;color:#a8b6ce;font-size:.9rem;padding-top:10px}@media(max-width:500px){header,footer{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1}}</style>
<div class="wrap"><header><div><h1>벽돌깨기</h1><p>공을 튕겨 모든 벽돌을 깨보세요.</p></div><div class="stats"><div class="stat"><b id="score">0</b><small>점수</small></div><div class="stat"><b id="lives">3</b><small>목숨</small></div></div></header><div class="frame"><canvas id="game" width="720" height="480"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">준비됐나요?</h2><p id="msg">마우스·터치 또는 ← → 키로 패들을 움직이세요.</p><button class="button" id="start">게임 시작</button></div></div></div><footer><span>마우스·터치 · ← → 방향키</span><span>스페이스바: 일시정지 · R: 다시 시작</span></footer></div>
<script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),ov=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),lifeEl=document.querySelector('#lives'),title=document.querySelector('#title'),msg=document.querySelector('#msg'),btn=document.querySelector('#start'),W=720,H=480,colors=['#72e6c1','#63c7ff','#a996ff','#ff8b9a','#ffd166'];let p={x:304,y:448,w:112,h:13},b={x:360,y:422,r:8,dx:3.4,dy:-4.2},br=[],score=0,lives=3,run=false,pause=false,keys={};function reset(){score=0;lives=3;p.x=304;b.x=360;b.y=422;b.dx=3.4*(Math.random()<.5?-1:1);b.dy=-4.2;br=[];for(let r=0;r<5;r++)for(let x=0;x<10;x++)br.push({x:34+x*66,y:52+r*31,w:58,h:22,c:colors[r],on:1});hud();draw()}function hud(){scoreEl.textContent=score;lifeEl.textContent=lives}function rr(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function draw(){g.fillStyle='#101827';g.fillRect(0,0,W,H);for(let z of br)if(z.on)rr(z.x,z.y,z.w,z.h,5,z.c);rr(p.x,p.y,p.w,p.h,7,'#edf4ff');g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fillStyle='#fff';g.shadowColor='#72e6c1';g.shadowBlur=14;g.fill();g.shadowBlur=0}function end(win){run=false;title.textContent=win?'완벽해요!':'게임 오버';msg.textContent=win?'모든 벽돌을 깼어요!':'점수 '+score+'점 · 다시 도전해볼까요?';btn.textContent='다시 하기';ov.classList.remove('hide')}function tick(){if(!run||pause)return;p.x=Math.max(0,Math.min(W-p.w,p.x+(keys.ArrowRight?8:0)-(keys.ArrowLeft?8:0)));b.x+=b.dx;b.y+=b.dy;if(b.x<b.r||b.x>W-b.r)b.dx*=-1;if(b.y<b.r)b.dy=Math.abs(b.dy);if(b.dy>0&&b.y+b.r>=p.y&&b.x>=p.x&&b.x<=p.x+p.w){b.dx=((b.x-p.x-p.w/2)/(p.w/2))*5;b.dy=-4.5}for(let z of br)if(z.on&&b.x+b.r>z.x&&b.x-b.r<z.x+z.w&&b.y+b.r>z.y&&b.y-b.r<z.y+z.h){z.on=0;b.dy*=-1;score+=10;hud();break}if(b.y>H){lives--;hud();if(!lives)return end(false);b.x=360;b.y=422;b.dy=-4.2}if(br.every(z=>!z.on))return end(true);draw();requestAnimationFrame(tick)}function begin(){reset();run=true;pause=false;ov.classList.add('hide');requestAnimationFrame(tick)}function move(e){let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(W-p.w,(e.clientX-r.left)*W/r.width-p.w/2));draw()}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);btn.onclick=begin;window.onkeydown=e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();if(run){pause=!pause;if(!pause)requestAnimationFrame(tick)}}if(e.key.toLowerCase()==='r')begin()};window.onkeyup=e=>keys[e.key]=0;reset()})();</script></html>
